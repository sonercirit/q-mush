name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        if: ${{ !cancelled() }}
        run: bun run test

      - name: Run repository and static checks
        if: ${{ !cancelled() }}
        run: bun run check

      - name: Build production assets
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Check tracked whitespace
        if: ${{ !cancelled() }}
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
