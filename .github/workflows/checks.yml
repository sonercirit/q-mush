name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test dependencies
        if: ${{ matrix.shard == 1 }}
        run: bunx playwright install --with-deps chromium

      - name: Run test shard
        run: bun run test:unit --shard=${{ matrix.shard }}/2

      - name: Run real-browser regressions
        if: ${{ matrix.shard == 1 }}
        run: bun run test:browser

  static-checks:
    name: Repository and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check dependency release ages
        if:
          ${{ github.event_name == 'push' || github.event.pull_request.base.sha
          != '' }}
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            git diff --quiet HEAD^ HEAD -- bun.lock || bun run dependency-age
          elif ! git diff --quiet "${{ github.event.pull_request.base.sha }}"...HEAD -- bun.lock; then
            bun run dependency-age
          fi

      - name: Run repository and static checks
        run: bun run check

  build:
    name: Build and tracked whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Check tracked whitespace
        if: ${{ !cancelled() }}
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  aggregate:
    name: Tests and static checks
    needs: [tests, static-checks, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every check leg to succeed
        run: |
          if [[ "${{ needs.tests.result }}" != "success" || \
                "${{ needs.static-checks.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" ]]; then
            exit 1
          fi
