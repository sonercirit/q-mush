name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: Tests (shard 1/12),
              command: "bun run test:unit --shard=1/12",
            }
          - {
              name: Tests (shard 2/12),
              command: "bun run test:unit --shard=2/12",
            }
          - {
              name: Tests (shard 3/12),
              command: "bun run test:unit --shard=3/12",
            }
          - {
              name: Tests (shard 4/12),
              command: "bun run test:unit --shard=4/12",
            }
          - {
              name: Tests (shard 5/12),
              command: "bun run test:unit --shard=5/12",
            }
          - {
              name: Tests (shard 6/12),
              command: "bun run test:unit --shard=6/12",
            }
          - {
              name: Tests (shard 7/12),
              command: "bun run test:unit --shard=7/12",
            }
          - {
              name: Tests (shard 8/12),
              command: "bun run test:unit --shard=8/12",
            }
          - {
              name: Tests (shard 9/12),
              command: "bun run test:unit --shard=9/12",
            }
          - {
              name: Tests (shard 10/12),
              command: "bun run test:unit --shard=10/12",
            }
          - {
              name: Tests (shard 11/12),
              command: "bun run test:unit --shard=11/12",
            }
          - {
              name: Tests (shard 12/12),
              command: "bun run test:unit --shard=12/12",
            }
          - {
              name: Real-browser regressions,
              command: "bun run test:browser",
              browser: true,
            }
    steps: &installed-steps
      - name: Check out repository
        uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.0-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit shard
        if: ${{ !matrix.browser }}
        run: ${{ matrix.command }}
      - name: Restore Playwright Chromium
        if: ${{ matrix.browser }}
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install browser test dependencies
        if:
          ${{ matrix.browser && steps.playwright-cache.outputs.cache-hit !=
          'true' }}
        run: bunx playwright install --with-deps chromium
      - name: Run real-browser regressions
        if: ${{ matrix.browser }}
        run: bun run test:browser

  static-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: Lint (sync-engine scope),
              kind: lint,
              scopes: "sync-engine",
            }
          - {
              name: Lint (solid and shared scopes),
              kind: lint,
              scopes: "solid shared",
            }
          - {
              name: Lint (runner/scripts/test/root scopes),
              kind: lint,
              scopes: "runner-scripts test-root",
            }
          - { name: Consolidated static checks, kind: consolidated }
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.0-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run lint shard
        if: ${{ matrix.kind == 'lint' }}
        env:
          SCOPES: ${{ matrix.scopes }}
        run: |
          declare -A configs=(
            [sync-engine]=tsconfig.eslint-sync-engine.json
            [solid]=tsconfig.eslint-solid.json
            [shared]=tsconfig.eslint-shared.json
            [runner-scripts]=tsconfig.eslint-runner-scripts.json
            [test-root]=tsconfig.eslint-test-root.json
          )
          declare -A patterns=(
            [sync-engine]='sync-engine'
            [solid]='solid'
            [shared]='shared'
            [runner-scripts]='runner scripts'
            [test-root]='test root'
          )
          mapfile -d '' all < <(git ls-files -z '*.cjs' '*.cts' '*.js' '*.mjs' '*.mts' '*.ts' '*.tsx')
          for scope in $SCOPES; do
            files=()
            for file in "${all[@]}"; do
              top=${file%%/*}
              [[ $file != */* ]] && top=root
              for selected in ${patterns[$scope]}; do
                [[ $top == "$selected" ]] && files+=("$file")
              done
            done
            Q_MUSH_ESLINT_TSCONFIG=${configs[$scope]} bunx eslint --max-warnings 0 "${files[@]}" &
            pids+=("$!")
          done
          statuses=()
          for pid in "${pids[@]}"; do wait "$pid" || statuses+=("$?"); done
          (( ${#statuses[@]} == 0 ))
      - name: Run consolidated static checks in parallel
        if: ${{ matrix.kind == 'consolidated' }}
        run: |
          statuses=()
          node_modules/.bin/prettier --check . & pids+=("$!")
          node_modules/.bin/tsc --noEmit & pids+=("$!")
          bun scripts/repository-check.ts & pids+=("$!")
          bun run knip:production && bun run knip:test & pids+=("$!")
          bun scripts/cpd.ts & pids+=("$!")
          for pid in "${pids[@]}"; do wait "$pid" || statuses+=("$?"); done
          (( ${#statuses[@]} == 0 ))

  build:
    name: Build and tracked whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.0 }
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.0-
      - run: bun install --frozen-lockfile
      - if: ${{ !cancelled() }}
        run: bun run build
      - if: ${{ !cancelled() }}
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  aggregate:
    name: Tests and static checks
    needs: [tests, static-checks, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every check leg to succeed
        run: |
          if [[ "${{ needs.tests.result }}" != success || "${{ needs.static-checks.result }}" != success || "${{ needs.build.result }}" != success ]]; then exit 1; fi
      - name: Enforce overall wall-clock budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | jq -r .run_started_at)
          elapsed=$(( $(date +%s) - $(date --date="$started_at" +%s) ))
          echo "Overall workflow wall-clock duration: ${elapsed}s (budget: 60s)"
          if (( elapsed > 60 )); then
            echo "::error::Overall workflow took ${elapsed}s, exceeding the 60s wall-clock budget."
            exit 1
          fi
