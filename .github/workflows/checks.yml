name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests (shard 1/4)
            command: bun run test:unit --shard=1/4
          - name: Tests (shard 2/4)
            command: bun run test:unit --shard=2/4
          - name: Tests (shard 3/4)
            command: bun run test:unit --shard=3/4
          - name: Tests (shard 4/4)
            command: bun run test:unit --shard=4/4
          - name: Real-browser regressions
            command: bun run test:browser
            browser: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        if: ${{ !matrix.browser }}
        run: ${{ matrix.command }}

      - name: Restore Playwright Chromium
        if: ${{ matrix.browser }}
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1

      - name: Install browser test dependencies
        if:
          ${{ matrix.browser && steps.playwright-cache.outputs.cache-hit !=
          'true' }}
        run: bunx playwright install --with-deps chromium

      - name: Run real-browser regressions
        if: ${{ matrix.browser }}
        run: bun run test:browser

  static-checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Repository policy
            script: repository-check
          - name: Formatting
            script: format:check
          - name: Typecheck
            script: typecheck
          - name: Lint
            script: lint
          - name: Unused code
            script: knip
          - name: Copy-paste detection
            script: cpd

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: bun run ${{ matrix.script }}

  build:
    name: Build and tracked whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.0-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build production assets
        if: ${{ !cancelled() }}
        run: bun run build

      - name: Check tracked whitespace
        if: ${{ !cancelled() }}
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  aggregate:
    name: Tests and static checks
    needs: [tests, static-checks, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Require every check leg to succeed
        run: |
          if [[ "${{ needs.tests.result }}" != "success" || \
                "${{ needs.static-checks.result }}" != "success" || \
                "${{ needs.build.result }}" != "success" ]]; then
            exit 1
          fi

      - name: Enforce overall wall-clock budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started_at=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq .run_started_at)
          started_epoch=$(date --date="$started_at" +%s)
          elapsed=$(( $(date +%s) - started_epoch ))
          echo "Overall workflow wall-clock duration: ${elapsed}s (budget: 60s)"
          if (( elapsed > 60 )); then
            echo "::error::Overall workflow took ${elapsed}s, exceeding the 60s wall-clock budget."
            exit 1
          fi
